{% extends 'base.html' %}
{% load static %}

{% block title %}Campus Events Calendar - CampusEvents{% endblock %}

{% block content %}
<section class="container" style="padding: 4rem 0; min-height: 80vh;">
    <!-- Header -->
    <div style="margin-bottom: 3rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1.5rem;">
        <h1 style="font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">
            Campus Events Calendar
        </h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.95rem;">Interactive view of all scheduled approved events across campus. Click on any event to see detail info.</p>
    </div>

    <!-- FullCalendar container -->
    <div style="background: var(--surface-color); border: 1px solid var(--glass-border); padding: 2.5rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.15);">
        <div id="calendar"></div>
    </div>
</section>

<!-- Include FullCalendar.js files from CDN -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
    /* Styling overrides for FullCalendar to look nice in Dark theme */
    .fc {
        font-family: inherit;
        --fc-border-color: rgba(255, 255, 255, 0.08);
        --fc-page-bg-color: transparent;
        --fc-neutral-bg-color: rgba(255, 255, 255, 0.02);
        --fc-today-bg-color: rgba(56, 189, 248, 0.08);
        --fc-list-event-hover-bg-color: rgba(255, 255, 255, 0.05);
    }
    
    .fc-header-toolbar {
        margin-bottom: 2rem !important;
    }
    
    .fc-toolbar-title {
        font-size: 1.4rem !important;
        font-weight: 800;
        color: var(--text-primary);
    }
    
    .fc-button-primary {
        background-color: var(--surface-color) !important;
        border-color: var(--glass-border) !important;
        color: var(--text-primary) !important;
        font-weight: 600 !important;
        transition: var(--transition) !important;
        border-radius: 8px !important;
    }
    
    .fc-button-primary:hover {
        background-color: var(--surface-hover) !important;
    }
    
    .fc-button-active {
        background-color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
        color: var(--bg-color) !important;
    }
    
    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number {
        color: var(--text-secondary) !important;
        font-weight: 600;
        text-decoration: none !important;
        padding: 8px !important;
    }
    
    .fc-daygrid-day-number:hover {
        color: var(--text-primary) !important;
    }
    
    .fc-event {
        cursor: pointer;
        padding: 4px 8px;
        font-weight: 600;
        font-size: 0.82rem;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listMonth'
            },
            events: '/calendar/?format=json',
            eventClick: function(info) {
                if (info.event.url) {
                    window.location.href = info.event.url;
                    info.jsEvent.preventDefault(); // don't navigate directly
                }
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
