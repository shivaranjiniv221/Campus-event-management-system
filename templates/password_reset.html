{% extends 'base.html' %}
{% block title %}Reset Password - CampusEvents{% endblock %}
{% block content %}
<section class="container" style="padding: 6rem 0; display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: var(--surface-color); border: 1px solid var(--glass-border); padding: 3.5rem 3rem; border-radius: 24px; max-width: 450px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.2);">
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.8rem; text-align: center; color: var(--primary-color);">Forgot Password?</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; margin-bottom: 2.5rem; line-height: 1.5;">Enter your email address and we'll send you instructions to reset your password.</p>
        
        <form method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="id_email" style="font-weight: 600; font-size: 0.88rem; color: var(--text-secondary);">Email Address</label>
                <input type="email" name="email" id="id_email" placeholder="e.g. yourname@university.edu" required
                       style="background: var(--bg-color); border: 1px solid var(--glass-border); padding: 0.8rem 1rem; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; transition: var(--transition);">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 12px; padding: 0.8rem;">
                Send Reset Link
            </button>
        </form>
    </div>
</section>
{% endblock %}
