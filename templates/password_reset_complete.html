{% extends 'base.html' %}
{% block title %}Password Reset Complete - CampusEvents{% endblock %}
{% block content %}
<section class="container" style="padding: 6rem 0; display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: var(--surface-color); border: 1px solid var(--glass-border); padding: 3.5rem 3rem; border-radius: 24px; max-width: 450px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;">
        <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">✅</span>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.8rem; color: var(--primary-color);">Password Reset Complete</h1>
        <p style="color: var(--text-secondary); font-size: 0.92rem; line-height: 1.6; margin-bottom: 2rem;">Your password has been successfully reset. You can now log in using your new credentials.</p>
        <a href="{% url 'login' %}" class="btn btn-primary" style="display: block; border-radius: 12px; padding: 0.8rem;">Log In</a>
    </div>
</section>
{% endblock %}
